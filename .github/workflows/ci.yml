# A tool whose whole claim is "it will say UNDETERMINED rather than guess" has to answer
# for its own gates.
#
# It ships TWO HALVES from one tree -- `undetermined` on PyPI and on npm -- and the gates
# below are this package's own properties pointed back at the package:
#
#   1. IT CAN SAY BOTH THINGS. A tool that always answered "undetermined" would pass every
#      test that checks it does not guess, and would be useless. A tool that always
#      answered with a number would pass every test that checks it reports one. The
#      `itself` job below runs one adapter whose constant IS determined and one whose
#      constant is NOT, and asserts each verdict -- because a verdict is only evidence if
#      the other verdict was reachable.
#
#   2. THE TWO HALVES ARE ONE INSTRUMENT. Every threshold here is a judgement call, and a
#      half that drifted on one would answer a different question under the same
#      documentation. The parity suite compares them directly, and this file asserts the
#      parity suite was not SKIPPED -- a skip and a pass look identical in a tally, which
#      is the failure this package's sibling `didrun` exists for.
#
#   3. NO DEPENDENCIES, ASSERTED. `dependencies = []` is a claim about the code, not a
#      check on it.
#
#   4. EVERY SUITE HERE HAS A FLOOR UNDER IT, AND THE FLOOR IS NOT HAND-ROLLED. Point 2
#      used to be a `grep -c` over verbose unittest output in the `parity` job, and
#      nowhere else: the other four suites were trusted to their exit codes. An exit code
#      cannot tell you whether anything ran. So the two siblings that exist for exactly
#      this are installed and used --
#
#        npm install --save-dev @megapixel99/didrun   # did the command DO anything
#        npm install --save-dev zerocase              # what does the report SAY ran
#
#      -- and the gates live in `package.json` scripts rather than in this file, so
#      `npm run test:js` on a laptop is the gate CI runs and not a paraphrase of it.
#
#      THESE ARE devDependencies AND POINT 3 STILL HOLDS. `dependencies` is what a
#      consumer installs and it is still empty; the `artifacts` job asserts that against
#      the built wheel and the packed tarball rather than against this sentence.
#
# Action versions are pinned at v7 deliberately. Older majors still run, on a Node the
# runner silently substitutes, and a pin that is wrong for its own runtime is invisible
# in a pass/fail -- you only see it in an annotation nobody reads.
name: ci

on:
  push:
    # `master` only. A branch with an open PR matches both triggers and every job runs
    # twice, and a concurrency group does NOT fix it: the push event keys on
    # `refs/heads/<branch>` while the pull_request event keys on `<branch>`, so they
    # land in different groups.
    branches: [master]
  pull_request:
  workflow_dispatch:
  # `release.yml` calls this workflow rather than copying the jobs into itself. A
  # release gate that has drifted from the suite it claims to be is worse than no gate.
  workflow_call:

# The Python half lives in `python/` beside `js/`, and is still IMPORTED as
# `undetermined`. Nothing here installs the package for the test jobs, so the interpreter
# is told where to find it once.
env:
  PYTHONPATH: python

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what `pyproject.toml` claims, and the claim is checked rather
        # than trusted: `requires-python = ">=3.9"` is a promise, and a promise nothing
        # runs is the stale-documentation defect in a metadata file. A sibling package
        # in this network shipped a 3.12-only f-string under a ">=3.9" floor and did not
        # import at all on the version it advertised.
        python-version: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'   # the parity tests shell out to it, and `didrun` runs on it

      - name: no dependencies, and that is a design constraint
        run: |
          set -euo pipefail
          if python3 -c "import undetermined, undetermined.core, undetermined.budget, undetermined.fmt" 2>&1 \
             | grep -q "ModuleNotFoundError"; then
            echo "::error::undetermined imported something outside the standard library"
            exit 1
          fi
          python3 -c "import undetermined; print('undetermined', undetermined.__version__)"

      # `npm ci` and not `npm install`: the lockfile is what pins WHICH `didrun` decided
      # this run was evidence. A guard that silently changed version between two runs
      # makes its own verdicts incomparable.
      - name: the guards
        run: npm ci

      - name: the suites, with a floor under them
        # `didrun --expect-count` reads unittest's own "Ran N tests" and refuses below the
        # floor. The second predicate is the one that matters and it is not redundant:
        # unittest counts a SKIPPED test in that number, so the count alone is satisfied
        # by a suite that ran nothing -- exactly `zerocase`'s "a total is not a
        # denominator". A run with even one skip ends `OK (skipped=1)` rather than `OK`,
        # and the pattern below does not match it.
        run: npm run test:py

  javascript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `package.json` says `>=20`, and `node:test` is what the suites use.
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: no dependencies here either
        # ASKED OF GIT RATHER THAN OF THE FILESYSTEM. This used to be `[ -d node_modules ]`,
        # which was the same answer while nothing installed anything; the step below now
        # creates that directory, and a check that would start failing on its own success
        # is a check somebody deletes. The claim was always "not committed".
        run: |
          set -euo pipefail
          if [ -n "$(git ls-files node_modules)" ]; then
            echo "::error::node_modules is committed"
            exit 1
          fi
          node -e "const p=require('./package.json');
                   if (Object.keys(p.dependencies||{}).length) {
                     console.error('::error::package.json declares dependencies');
                     process.exit(1);
                   }
                   console.log(p.name, p.version)"

      - name: the guards
        run: npm ci

      - name: the suites, with a floor under them
        # `node --test` given a glob that matches nothing prints a plan of zero and exits
        # 0 -- measured, not assumed, and it is the whole reason this is not just the
        # runner's exit code. `zerocase --tap` reads the `1..N` plan out of the report the
        # runner already wrote, subtracts `# SKIP` and `# TODO`, and requires that the
        # report was written BY THIS RUN: a `js.tap` left behind by an earlier job parses
        # beautifully and describes something that did not happen here.
        run: npm run test:js

  versions:
    # THE VERSION LIVES IN THREE FILES AND THAT IS THREE PLACES TO DRIFT.
    # `pyproject.toml` is what PyPI publishes, `package.json` is what npm publishes, and
    # `__version__` is what a user who imports the package reads back. A release where
    # the first two agree and the third does not reports the wrong number to everybody
    # who asks it politely.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: all three agree
        run: |
          set -euo pipefail
          py=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          js=$(node -p "require('./package.json').version")
          # Imported rather than grepped: this is the number a user actually gets back.
          # PYTHONDONTWRITEBYTECODE so the check leaves no `.pyc` for a later run to
          # read -- cache invalidation is keyed on mtime at one-second granularity.
          dunder=$(PYTHONDONTWRITEBYTECODE=1 python3 -c "import undetermined; print(undetermined.__version__)")
          echo "pyproject=$py  package.json=$js  __version__=$dunder"
          if [ "$py" != "$js" ] || [ "$py" != "$dunder" ]; then
            echo "::error::the three versions disagree"
            exit 1
          fi

  parity:
    # THE TWO HALVES ARE ONE INSTRUMENT, OR THEY ARE TWO INSTRUMENTS WITH ONE NAME.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: the guards
        run: npm ci

      - name: the halves agree, and the test was not skipped
        # `skipUnless(node)` keeps the suite runnable for a Python-only contributor, and
        # in CI a skip and a pass look identical in a tally. This was fifteen lines of
        # `grep -q skipped` and `grep -c " ... ok"` parsing verbose unittest output, which
        # is a regex over a runner's human-facing text: it moves with the reporter and
        # with the minor version, and it was one `-v` away from silently passing forever.
        #
        # `didrun` is the package that exists for this question, and it is now the one
        # asked. Checked rather than argued: with `node` off PATH the whole suite skips,
        # unittest still prints `Ran 21 tests` and still exits 0, the count predicate is
        # satisfied by that 21 -- and the run is reported DID NOT RUN with exit 3 on the
        # `OK` predicate alone.
        run: npm run test:parity

  itself:
    # THE DIVERGENCE GATE. Both verdicts must be reachable, or neither is evidence.
    #
    # The two adapters below differ in exactly one way. `heads` has expectation truth/2,
    # so c = truth / (truth/2) = 2 at every rung and the ladder plateaus. `flat` has an
    # expectation that does not depend on truth at all, so c = truth/6 climbs with every
    # rung and no run of rungs ever agrees. One report, two verdicts, from one call.
    #
    # BOTH SCRIPTS ARE WRITTEN TO A FILE AND RUN UNDER `didrun` RATHER THAN INLINE. The
    # assertions in them are loud when they fail, and say nothing at all about whether
    # they were reached: an early `return`, an import that resolved to a stub, a heredoc
    # truncated by an editor all exit 0 having asserted nothing. `--expect` on the
    # closing sentence is the difference between "it did not fail" and "it ran".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: the guards
        run: npm ci

      - name: it reports a constant when there is one, and refuses when there is not
        run: |
          set -euo pipefail
          cat > /tmp/itself.py <<'PY'
          import random
          from undetermined import characterize, UNDETERMINED

          class Coin:
              def truths(self):
                  return [8, 32, 128, 512]

              @property
              def observables(self):
                  def heads(truth, seed):
                      r = random.Random(seed)
                      return sum(1 for _ in range(truth) if r.random() < 0.5)

                  def flat(truth, seed):
                      r = random.Random(seed)
                      return sum(1 for _ in range(12) if r.random() < 0.5) + 0.5

                  return {"heads": heads, "flat": flat}

          rep = characterize(Coin(), trials=600)
          h = rep["per_observable"]["heads"]
          f = rep["per_observable"]["flat"]
          print("heads:", h["constant"], "+/-", h["constant_se"], "|", h["plateau"]["why"])
          print("flat: ", f["constant"], "|", f["plateau"]["why"])
          print("undetermined:", rep["undetermined"])

          assert h["constant"] is not UNDETERMINED, "the determined case reported no constant"
          assert abs(h["constant"] - 2.0) < 0.05, h["constant"]
          assert "heads" not in rep["undetermined"]

          assert f["constant"] is UNDETERMINED, "a constant that never settles was reported anyway"
          assert rep["undetermined"] == ["flat"], rep["undetermined"]
          assert any(n.startswith("`flat`") for n in rep["notes"]), rep["notes"]
          print("OK: both verdicts reachable from one report")
          PY
          ./node_modules/.bin/didrun \
            --expect "OK: both verdicts reachable from one report" \
            -- python3 /tmp/itself.py

      - name: and the JavaScript half says the same about the same shapes
        run: |
          set -euo pipefail
          cat > /tmp/itself.mjs <<'JS'
          // `--input-type=module -e` took the source on the command line, so the
          // specifier `./js/src/index.js` resolved against the WORKING DIRECTORY. A file
          // in /tmp resolves a relative specifier against ITSELF, so the same resolution
          // is written out rather than the file being dropped into the repository, where
          // `npm pack` and `.npmignore` would both have to be told about it.
          import path from "node:path";
          import { pathToFileURL } from "node:url";
          const { characterize, UNDETERMINED } =
            await import(pathToFileURL(path.resolve(process.cwd(), "js/src/index.js")).href);
          const mulberry = (s) => () => {
            s |= 0; s = (s + 0x6D2B79F5) | 0;
            let t = Math.imul(s ^ (s >>> 15), 1 | s);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
          const adapter = {
            truths: () => [8, 32, 128, 512],
            observables: {
              heads: (truth, seed) => { const r = mulberry(seed); let n = 0;
                for (let i = 0; i < truth; i++) if (r() < 0.5) n++; return n; },
              flat: (truth, seed) => { const r = mulberry(seed); let n = 0;
                for (let i = 0; i < 12; i++) if (r() < 0.5) n++; return n + 0.5; },
            },
          };
          const rep = characterize(adapter, { trials: 600 });
          const h = rep.per_observable.heads, f = rep.per_observable.flat;
          console.log("heads:", h.constant, "+/-", h.constant_se, "|", h.plateau.why);
          console.log("flat: ", f.constant, "|", f.plateau.why);
          if (h.constant === UNDETERMINED) {
            console.error("::error::the determined case reported no constant");
            process.exit(1);
          }
          if (Math.abs(h.constant - 2.0) >= 0.05) {
            console.error("::error::expected c=2, got " + h.constant);
            process.exit(1);
          }
          if (f.constant !== UNDETERMINED || rep.undetermined.join() !== "flat") {
            console.error("::error::a constant that never settles was reported anyway");
            process.exit(1);
          }
          console.log("OK: both verdicts reachable from one report");
          JS
          ./node_modules/.bin/didrun \
            --expect "OK: both verdicts reachable from one report" \
            -- node /tmp/itself.mjs

  artifacts:
    # THE SHIPPED ARTIFACTS, not the source tree. This is a library rather than a CLI --
    # an adapter is a code object with closures in it, so there is nothing to pass on a
    # command line -- and what a user gets is therefore an import.
    #
    # PYTHONPATH IS DELIBERATELY EMPTY HERE. The workflow-level `PYTHONPATH: python` is
    # what lets the test jobs import without installing, and it also lets *pip* import
    # the package, which makes pip announce it is already installed and skip the install.
    # The job that exists to prove the built artifact works must not inherit the shortcut
    # that makes the source importable.
    env:
      PYTHONPATH: ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: the guards
        run: npm ci

      - name: build both, install both, import both
        run: |
          set -euo pipefail
          python3 -m pip install --quiet build
          python3 -m build --wheel --outdir /tmp/dist
          npm pack --pack-destination /tmp/dist

          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install /tmp/dist/*.whl

          cat > /tmp/check_wheel.py <<'PY'
          import importlib.metadata as md
          import undetermined
          # The INSTALLED metadata rather than the file: `tomllib` is 3.11+, and what a
          # user actually gets is what the wheel declares, not what the source says.
          requires = md.requires("undetermined") or []
          assert requires == [], requires
          assert undetermined.characterize and undetermined.plateau and undetermined.mde
          print("wheel imports", undetermined.__version__, "with no dependencies")
          PY

          mkdir -p /tmp/tarball && tar -xzf /tmp/dist/*.tgz -C /tmp/tarball

          cat > /tmp/check_tarball.mjs <<'JS'
          import { readFileSync } from "node:fs";
          import * as m from "/tmp/tarball/package/js/src/index.js";
          for (const n of ["characterize", "plateau", "mde", "trialsFor", "toTolerance"]) {
            if (typeof m[n] !== "function") {
              console.error("::error::the packed tarball is missing " + n);
              process.exit(1);
            }
          }
          // THE OTHER HALF OF "NO DEPENDENCIES, ASSERTED", and the half that was missing.
          // The `javascript` job reads the source tree's package.json; this reads the one
          // a consumer receives. `devDependencies` are not shipped and are not asked
          // about -- `dependencies` is the field that becomes somebody else's install.
          const pkg = JSON.parse(readFileSync("/tmp/tarball/package/package.json", "utf8"));
          const deps = Object.keys(pkg.dependencies || {});
          if (deps.length) {
            console.error("::error::the packed tarball declares dependencies: " + deps.join(", "));
            process.exit(1);
          }
          console.log("tarball imports clean, and declares no dependencies");
          JS

          # From /tmp, so a stray import of the source tree cannot pass for the wheel.
          # `didrun` is therefore named by absolute path: `./node_modules/.bin` is a
          # relative path and the whole point of this step is that the working directory
          # is no longer the repository.
          cd /tmp
          "$GITHUB_WORKSPACE/node_modules/.bin/didrun" \
            --expect "wheel imports .* with no dependencies" \
            -- /tmp/venv/bin/python /tmp/check_wheel.py
          "$GITHUB_WORKSPACE/node_modules/.bin/didrun" \
            --expect "tarball imports clean, and declares no dependencies" \
            -- node /tmp/check_tarball.mjs
